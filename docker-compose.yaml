services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: org_structure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d org_structure"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: org_structure
      DB_SSLMODE: disable
      DATABASE_DSN: postgres://postgres:postgres@db:5432/org_structure?sslmode=disable
    ports:
      - "8080:8080"
    command:
      - /bin/sh
      - -c
      - goose -dir /app/migrations postgres "$${DATABASE_DSN}" up && exec /app/api
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
